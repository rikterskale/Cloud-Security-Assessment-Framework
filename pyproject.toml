[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csaf"
version = "1.0.0"
description = "Read-only, multi-cloud security posture assessment framework (AWS/Azure/GCP/Kubernetes)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Intended Audience :: Information Technology",
]
dependencies = [
    "boto3>=1.34,<2.0",
    "botocore>=1.34,<2.0",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.15,<2.0", "requests>=2.34.2,<3.0"]
gcp = ["google-auth>=2.28,<3.0", "requests>=2.34.2,<3.0"]
k8s = ["kubernetes>=29,<30"]
ci = ["ruff>=0.5", "pip-audit>=2.7", "jsonschema>=4.20", "coverage>=7.4"]

[project.scripts]
csaf-assess = "invoke_assessment:main"
csaf-sign-engagement = "sign_engagement:main"

# Third-party distributions contribute additional AWS/Azure/GCP/K8s check
# modules by declaring entries in the matching group below, e.g.:
#
#   [project.entry-points."csaf.modules.aws"]
#   my_service = "my_csaf_extra.aws:MyServiceModule"
#
# CSAF ships no external plugins itself; these groups exist so
# csaf.plugins.discover_plugin_modules() has somewhere to look. A built-in
# module always wins on a name collision - see csaf/plugins.py.
[project.entry-points."csaf.modules.aws"]
[project.entry-points."csaf.modules.azure"]
[project.entry-points."csaf.modules.gcp"]
[project.entry-points."csaf.modules.k8s"]

[tool.setuptools]
packages = ["csaf", "csaf.clouds", "csaf.clouds.aws", "csaf.clouds.aws.modules", "csaf.clouds.azure", "csaf.clouds.azure.modules", "csaf.clouds.gcp", "csaf.clouds.gcp.modules", "csaf.clouds.k8s", "csaf.clouds.k8s.modules"]
py-modules = ["invoke_assessment", "test_dependencies", "sign_engagement"]
