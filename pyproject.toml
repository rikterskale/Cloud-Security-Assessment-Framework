[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-saf"
version = "1.1.0"
description = "Read-only, multi-cloud security posture assessment framework (AWS/Azure/GCP/Kubernetes)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "rikterskale" }]
keywords = ["cloud", "security", "assessment", "aws", "azure", "gcp", "kubernetes", "cis", "nist"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Intended Audience :: Information Technology",
]
dependencies = [
    "jsonschema>=4.20,<5.0",
]

[project.urls]
Homepage = "https://github.com/rikterskale/Cloud-Security-Assessment-Framework"
Repository = "https://github.com/rikterskale/Cloud-Security-Assessment-Framework"
Issues = "https://github.com/rikterskale/Cloud-Security-Assessment-Framework/issues"
Changelog = "https://github.com/rikterskale/Cloud-Security-Assessment-Framework/blob/main/CHANGELOG.md"

[project.optional-dependencies]
aws = ["boto3>=1.34,<2.0", "botocore>=1.34,<2.0"]
azure = ["azure-identity>=1.15,<2.0", "requests>=2.31,<3.0"]
gcp = ["google-auth>=2.28,<3.0", "requests>=2.31,<3.0"]
k8s = ["kubernetes>=29,<30"]
all = [
    "boto3>=1.34,<2.0",
    "botocore>=1.34,<2.0",
    "azure-identity>=1.15,<2.0",
    "google-auth>=2.28,<3.0",
    "requests>=2.31,<3.0",
    "kubernetes>=29,<30",
]
ci = [
    "ruff>=0.5",
    "pip-audit>=2.7",
    "coverage>=7.4",
    "build>=1.2",
    "twine>=5.1",
    "setuptools>=68",
    "wheel>=0.43",
    "mypy>=1.10",
]

[project.scripts]
csaf-assess = "invoke_assessment:main"
cloud-saf = "invoke_assessment:main"
csaf-sign-engagement = "sign_engagement:main"
csaf-lint-catalog = "csaf.authoring:lint_main"
csaf-new-module = "csaf.authoring:scaffold_main"
csaf-attest = "csaf.attestation:main"
csaf-campaign = "csaf.campaign:main"
csaf-drift = "csaf.monitor:main"
csaf-aggregate = "csaf.aggregate:main"
csaf-detection-pack = "csaf.detection_pack:main"
csaf-attack-path = "csaf.attack_path:main"

# Third-party distributions contribute additional AWS/Azure/GCP/K8s check
# modules by declaring entries in the matching group below, e.g.:
#
#   [project.entry-points."csaf.modules.aws"]
#   my_service = "my_csaf_extra.aws:MyServiceModule"
#
# CSAF ships no external plugins itself; these groups exist so
# csaf.plugins.discover_plugin_modules() has somewhere to look. A built-in
# module always wins on a name collision - see csaf/plugins.py.
[project.entry-points."csaf.modules.aws"]
[project.entry-points."csaf.modules.azure"]
[project.entry-points."csaf.modules.gcp"]
[project.entry-points."csaf.modules.k8s"]

[tool.setuptools]
py-modules = ["invoke_assessment", "test_dependencies", "sign_engagement"]

[tool.setuptools.packages.find]
include = ["csaf*"]

[tool.setuptools.package-data]
"csaf.resources" = ["controls/*.json", "baselines/*.json", "schemas/*.json"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
pretty = true
show_error_codes = true
# Gradually typed: new modules are gated; the existing session/provider surface is duck-typed.
files = ["csaf/errors.py", "csaf/preflight.py"]
follow_imports = "skip"
