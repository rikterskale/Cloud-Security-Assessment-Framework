version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-patch:
        update-types: ["patch"]
      provider-sdks:
        patterns: ["boto3", "botocore", "azure-*", "google-*", "kubernetes", "requests"]
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-patch:
        update-types: ["patch"]
    open-pull-requests-limit: 10
