name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, verify, attest, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: >
          python -c "import os, pathlib, tomllib;
          version=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'];
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}',
          f'tag {os.environ[\"GITHUB_REF_NAME\"]} does not match package version v{version}'"
      - name: Build distributions
        env:
          CSAF_SOURCE_REVISION: ${{ github.sha }}
        run: python -m build --no-isolation
      - name: Verify package metadata
        run: python -m twine check dist/*
      - name: Generate CycloneDX SBOM and checksums
        run: |
          pip-audit -r "$GITHUB_WORKSPACE/requirements-lock.txt" --format cyclonedx-json --output dist/sbom.cdx.json
          sha256sum dist/*.whl dist/*.tar.gz dist/sbom.cdx.json > dist/SHA256SUMS
      - name: Smoke-test the installed wheel
        run: |
          python -m venv wheel-venv
          wheel-venv/bin/pip install --require-hashes -r requirements-lock.txt
          wheel-venv/bin/pip install --no-deps dist/*.whl
          wheel-venv/bin/python -m pip check
          smoke_root=$(mktemp -d)
          cd "$smoke_root"
          set +e
          "$GITHUB_WORKSPACE/wheel-venv/bin/csaf-assess" --self-check --output-dir reports --log-level ERROR
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
          test -f "$(find reports -name manifest.json -print -quit)"
      - name: Smoke-test the installed source distribution
        run: |
          python -m venv sdist-venv
          sdist-venv/bin/pip install --require-hashes -r requirements-lock.txt
          sdist-venv/bin/pip install --no-deps dist/*.tar.gz
          sdist-venv/bin/python -m pip check
          smoke_root=$(mktemp -d)
          cd "$smoke_root"
          set +e
          "$GITHUB_WORKSPACE/sdist-venv/bin/csaf-assess" --self-check --output-dir reports --log-level ERROR
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
          test -f "$(find reports -name manifest.json -print -quit)"
      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Attest SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/sbom.cdx.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: csaf-release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
