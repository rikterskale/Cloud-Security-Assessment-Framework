name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-ci.txt
      - name: Ruff lint
        run: ruff check csaf tests invoke_assessment.py test_dependencies.py
      - name: Ruff format check
        run: ruff format --check csaf tests invoke_assessment.py test_dependencies.py

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit
        run: pip-audit --requirement requirements.txt

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-ci.txt
      - name: Dependency preflight
        run: python test_dependencies.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline self-check report generation
        run: |
          python invoke_assessment.py --self-check --output-dir ci-out || true
          test -f ci-out/findings.csv
          test -f ci-out/technical-report.json
          test -f ci-out/manifest.json

  ci-success:
    name: CI success
    needs: [lint, audit, test]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required gates passed."
