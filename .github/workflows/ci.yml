name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Validate workflow YAML
        run: python -c "from pathlib import Path; import yaml; [yaml.safe_load(path.read_text(encoding='utf-8')) for path in Path('.github/workflows').glob('*.yml')]"
      - name: Validate GitHub Actions syntax and security-sensitive expressions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color
      - name: Check shell script syntax
        run: |
          bash -n scripts/quickstart.sh
          shellcheck scripts/quickstart.sh
      - name: Reject whitespace errors
        run: git diff --check
      - name: Compile Python sources
        run: python -m compileall -q csaf tools invoke_assessment.py test_dependencies.py sign_engagement.py setup.py
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Ruff lint
        run: ruff check csaf tests tools invoke_assessment.py test_dependencies.py sign_engagement.py setup.py
      - name: Ruff format check
        run: ruff format --check csaf tests tools invoke_assessment.py test_dependencies.py sign_engagement.py setup.py
      - name: Verify generated CLI reference
        run: |
          python tools/generate_cli_reference.py
          git diff --exit-code -- docs/CLI_REFERENCE.md
      - name: Verify generated shell completions
        run: |
          python tools/generate_completions.py bash > completions/csaf-assess.bash
          python tools/generate_completions.py zsh > completions/_csaf-assess
          python tools/generate_completions.py powershell > completions/csaf-assess.ps1
          git diff --exit-code -- completions/
      - name: Validate shipped control catalogs against their real module registries
        # Invoked as a module (not the csaf-lint-catalog console script) because
        # this lint job does not install the package; it runs tooling from the
        # checkout, like the CLI-reference and completion steps above.
        # No --strict: the shipped catalogs intentionally emit "AdversarySimulation
        # control has no MITRE mapping" warnings (those controls are filtered out of
        # that profile by design). Gate on errors (module/check/schema resolution),
        # not on expected design warnings.
        run: |
          python -m csaf.authoring \
            csaf/resources/controls/control-catalog.json \
            csaf/resources/controls/control-catalog-azure.json \
            csaf/resources/controls/control-catalog-gcp.json \
            csaf/resources/controls/control-catalog-k8s.json

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Verify installed dependencies
        run: python -m pip check
      - name: pip-audit (locked core + optional provider dependencies)
        run: pip-audit -r "${{ github.workspace }}/requirements-lock.txt"

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Generate CycloneDX SBOM (locked core + optional provider dependencies)
        run: >
          pip-audit -r "${{ github.workspace }}/requirements-lock.txt"
          --format cyclonedx-json --output sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Dependency preflight
        run: python test_dependencies.py
      - name: Unit tests with coverage
        run: python -m coverage run --source=csaf,invoke_assessment -m unittest discover -s tests -v
      - name: Coverage gate
        run: |
          python -m coverage report --show-missing
          python -m coverage report --fail-under=90
      - name: Offline self-check report generation
        run: |
          set +e
          python invoke_assessment.py --self-check --output-dir ci-out
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "invoke_assessment.py --self-check exited with unexpected code $code"
            exit 1
          fi
          run_dir=$(find ci-out -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$run_dir"
          test -f "$run_dir/findings.csv"
          test -f "$run_dir/technical-report.json"
          test -f "$run_dir/manifest.json"

  package:
    name: Build and installed-package smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Build distributions with immutable source revision
        env:
          CSAF_SOURCE_REVISION: ${{ github.sha }}
        run: python -m build --no-isolation
      - run: python -m twine check dist/*
      - name: Confirm distributions contain only intended package resources
        run: |
          python -c "import tarfile; archive=next(__import__('pathlib').Path('dist').glob('*.tar.gz')); names=tarfile.open(archive).getnames(); assert any(name.endswith('csaf/resources/controls/control-catalog.json') for name in names); assert any(name.endswith('csaf/resources/schemas/control-catalog.schema.json') for name in names)"
      - name: Install wheel without repository-relative files
        run: |
          python -m venv wheel-venv
          wheel-venv/bin/pip install --require-hashes -r requirements-lock.txt
          wheel-venv/bin/pip install --no-deps dist/*.whl
          wheel-venv/bin/python -m pip check
      - name: Install source distribution without repository-relative files
        run: |
          python -m venv sdist-venv
          sdist-venv/bin/pip install --require-hashes -r requirements-lock.txt
          sdist-venv/bin/pip install --no-deps dist/*.tar.gz
          sdist-venv/bin/python -m pip check
      - name: Run installed console script from an unrelated directory
        run: |
          smoke_root=$(mktemp -d)
          cd "$smoke_root"
          set +e
          "$GITHUB_WORKSPACE/wheel-venv/bin/csaf-assess" --self-check --output-dir reports --log-level ERROR
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
          run_dir=$(find reports -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -f "$run_dir/manifest.json"
          python -c "import json, pathlib; p=next(pathlib.Path('reports').iterdir()); assert json.loads((p/'manifest.json').read_text())['SourceRevision'] == '${{ github.sha }}'"
      - name: Run installed source-distribution console script
        run: |
          smoke_root=$(mktemp -d)
          cd "$smoke_root"
          set +e
          "$GITHUB_WORKSPACE/sdist-venv/bin/csaf-assess" --self-check --output-dir reports --log-level ERROR
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
          run_dir=$(find reports -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -f "$run_dir/manifest.json"

  test-cross-os:
    name: Unit tests (cross-OS)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Unit tests (portable, no shell-specific steps)
        run: python -m unittest discover -s tests -v

  novice-guides:
    name: Novice guide validation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
      - name: Validate canonical novice guides (fail closed)
        run: python tests/validate_novice_guides.py

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Block vulnerable or unacceptable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-1.0-only, AGPL-3.0-only

  ci-success:
    name: CI success
    if: ${{ always() }}
    needs: [lint, audit, sbom, test, test-cross-os, package, novice-guides, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce every required gate
        env:
          NEEDS_RESULT: ${{ toJSON(needs) }}
        run: |
          python -c "import json, os; failed={name: job['result'] for name, job in json.loads(os.environ['NEEDS_RESULT']).items() if job['result'] not in ('success', 'skipped')}; assert not failed, failed"
