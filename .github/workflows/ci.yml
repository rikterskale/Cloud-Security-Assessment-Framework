name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements-lock.txt
      - name: Ruff lint
        run: ruff check csaf tests invoke_assessment.py test_dependencies.py sign_engagement.py
      - name: Ruff format check
        run: ruff format --check csaf tests invoke_assessment.py test_dependencies.py sign_engagement.py

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements-lock.txt
      - name: pip-audit (locked core + optional provider dependencies)
        run: pip-audit -r requirements-lock.txt

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements-lock.txt
      - name: Generate CycloneDX SBOM (locked core + optional provider dependencies)
        run: pip-audit -r requirements-lock.txt --format cyclonedx-json --output sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install --require-hashes -r requirements-lock.txt
      - name: Dependency preflight
        run: python test_dependencies.py
      - name: Unit tests with coverage
        run: python -m coverage run --source=csaf,invoke_assessment -m unittest discover -s tests -v
      - name: Coverage gate
        run: |
          python -m coverage report --show-missing
          python -m coverage report --fail-under=90
      - name: Offline self-check report generation
        run: |
          set +e
          python invoke_assessment.py --self-check --output-dir ci-out
          code=$?
          set -e
          # EXIT_OK (0) and EXIT_INCOMPLETE (2) are expected outcomes for synthetic
          # self-check data; any other code (e.g. EXIT_FATAL=1) is a real failure.
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "invoke_assessment.py --self-check exited with unexpected code $code"
            exit 1
          fi
          run_dir=$(find ci-out -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$run_dir"
          test -f "$run_dir/findings.csv"
          test -f "$run_dir/technical-report.json"
          test -f "$run_dir/manifest.json"

  package:
    name: Build and installed-wheel smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements-lock.txt
      - name: Build distributions with immutable source revision
        env:
          CSAF_SOURCE_REVISION: ${{ github.sha }}
        run: python -m build --no-isolation
      - run: python -m twine check dist/*
      - name: Install wheel without repository-relative files
        run: |
          python -m venv --system-site-packages wheel-venv
          wheel-venv/bin/pip install --no-deps dist/*.whl
      - name: Run installed console script from an unrelated directory
        run: |
          smoke_root=$(mktemp -d)
          cd "$smoke_root"
          set +e
          "$GITHUB_WORKSPACE/wheel-venv/bin/csaf-assess" --self-check --output-dir reports --log-level ERROR
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
          run_dir=$(find reports -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -f "$run_dir/manifest.json"
          python -c "import json, pathlib; p=next(pathlib.Path('reports').iterdir()); assert json.loads((p/'manifest.json').read_text())['SourceRevision'] == '${{ github.sha }}'"

  ci-success:
    name: CI success
    needs: [lint, audit, sbom, test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "All required gates passed."
