name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-ci.txt
      - name: Ruff lint
        run: ruff check csaf tests invoke_assessment.py test_dependencies.py sign_engagement.py
      - name: Ruff format check
        run: ruff format --check csaf tests invoke_assessment.py test_dependencies.py sign_engagement.py

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-ci.txt
      - name: pip-audit (core + optional provider dependencies)
        run: >
          pip-audit
          -r requirements.txt
          -r requirements-azure.txt
          -r requirements-gcp.txt
          -r requirements-k8s.txt

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-ci.txt
      - name: Generate CycloneDX SBOM (core + optional provider dependencies)
        run: >
          pip-audit
          -r requirements.txt
          -r requirements-azure.txt
          -r requirements-gcp.txt
          -r requirements-k8s.txt
          --format cyclonedx-json --output sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-ci.txt
      - name: Dependency preflight
        run: python test_dependencies.py
      - name: Unit tests with coverage
        run: python -m coverage run --source=csaf,invoke_assessment -m unittest discover -s tests -v
      - name: Coverage gate
        run: |
          python -m coverage report --show-missing
          python -m coverage report --fail-under=90
      - name: Offline self-check report generation
        run: |
          set +e
          python invoke_assessment.py --self-check --output-dir ci-out
          code=$?
          set -e
          # EXIT_OK (0) and EXIT_INCOMPLETE (2) are expected outcomes for synthetic
          # self-check data; any other code (e.g. EXIT_FATAL=1) is a real failure.
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "invoke_assessment.py --self-check exited with unexpected code $code"
            exit 1
          fi
          test -f ci-out/findings.csv
          test -f ci-out/technical-report.json
          test -f ci-out/manifest.json

  ci-success:
    name: CI success
    needs: [lint, audit, sbom, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "All required gates passed."
